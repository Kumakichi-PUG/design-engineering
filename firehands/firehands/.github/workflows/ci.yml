name: CI (firehands)

on:
  push:
    branches: [main]
    paths:
      - 'firehands/firehands/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'firehands/firehands/**'

# 同じブランチで連続 push が来たら古い run はキャンセル
concurrency:
  group: firehands-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint / test / build
    runs-on: ubuntu-latest

    defaults:
      run:
        # 実プロジェクトは monorepo 内の firehands/firehands/ 配下
        working-directory: firehands/firehands

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: firehands/firehands/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
